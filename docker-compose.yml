services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: sleep-localstack
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: eu-west-2
      DEBUG: "0"
      SERVICES: s3,sqs
    volumes:
      - "./docker/localstack/init:/etc/localstack/init/ready.d:ro"
      - "localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: sleep-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sleep_monitoring
      POSTGRES_USER: sleep_app
      POSTGRES_PASSWORD: sleep_app_password
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleep_app -d sleep_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  localstack-data:
  postgres-data:
